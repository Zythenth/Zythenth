    <text x="28" y="44" fill="#f9f9fd" font-family="Georgia, 'Times New Roman', serif" font-size="22">Estatísticas no GitHub</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><g transform="translate(38 75)"><circle r="9" fill="url(#h-estrela)"/><path d="M 0,-8 Q 1.2,-1.2 8,0 Q 1.2,1.2 0,8 Q -1.2,1.2 -8,0 Q -1.2,-1.2 0,-8 Z" fill="#ffd36b"/><circle r="1.8" fill="#fff8de"/></g><text x="60" y="80" fill="#c3d0ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Estrelas recebidas</text><text x="282" y="80" fill="#f9f9fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">0</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.27s" dur="0.5s" fill="freeze"/><g transform="translate(38 99)"><path d="M 2,-1.6 L -9,-7 L 1,2.4 Z" fill="url(#cauda)"/><circle cx="2" cy="0" r="4.6" fill="url(#h-cometa)"/><circle cx="2" cy="0" r="2.4" fill="#f2fcff"/></g><text x="60" y="104" fill="#c3d0ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Commits</text><text x="282" y="104" fill="#f9f9fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">361</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.39s" dur="0.5s" fill="freeze"/><g transform="translate(38 123)"><ellipse rx="9" ry="2.6" fill="none" stroke="#c9b6ff" stroke-width="1.3" transform="rotate(-20)"/><circle r="5" fill="url(#g-roxo)"/></g><text x="60" y="128" fill="#c3d0ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Pull requests</text><text x="282" y="128" fill="#f9f9fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">55</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.5s" fill="freeze"/><g transform="translate(38 147)"><circle r="6.5" fill="url(#g-marte)"/><circle cx="-1.8" cy="-1.4" r="1.4" fill="#9a3a1c" opacity="0.8"/><circle cx="2" cy="2.2" r="1" fill="#9a3a1c" opacity="0.7"/></g><text x="60" y="152" fill="#c3d0ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Issues</text><text x="282" y="152" fill="#f9f9fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">3</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.63s" dur="0.5s" fill="freeze"/><g transform="translate(38 171)"><circle r="6.5" fill="url(#g-lua)" mask="url(#m-lua)"/><circle cx="7" cy="-6" r="1.1" fill="#fff6d8"/></g><text x="60" y="176" fill="#c3d0ea" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Contribuiu em (último ano)</text><text x="282" y="176" fill="#f9f9fd" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">2</text></g>
    <circle cx="400" cy="112" r="58" fill="url(#h-nivel)"/>
    <circle cx="400" cy="112" r="44" fill="none" stroke="#262a40" stroke-width="5"/>
    <circle cx="400" cy="112" r="44" fill="none" stroke="url(#orbita)" stroke-width="5" stroke-linecap="round"

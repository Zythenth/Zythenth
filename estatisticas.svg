    </circle>
    <g><animateTransform attributeName="transform" type="rotate" from="0 400 112" to="360 400 112" dur="18s" repeatCount="indefinite"/>
      <circle cx="444" cy="112" r="4.2" fill="url(#g-lua-nivel)"/></g>
    <circle cx="400" cy="112" r="27" fill="url(#g-nivel)"/>
    <ellipse cx="400" cy="112" rx="27" ry="27" fill="url(#sombra)"/>
    <text x="400" y="121" fill="#0b0c18" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" text-anchor="middle">C+</text>
